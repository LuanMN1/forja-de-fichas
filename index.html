<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>.player-identity{display:grid;grid-template-columns:72px repeat(4,minmax(0,1fr));gap:12px;align-items:center;margin-bottom:14px}.player-portrait{display:grid;justify-items:center;gap:4px}.player-portrait img,.player-portrait>span{width:60px;height:60px;object-fit:cover;border-radius:10px;background:var(--line);display:grid;place-items:center;font-size:28px}.player-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:start}.player-panel{min-width:0;padding:12px}.player-attrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.player-attr{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:5px;text-align:center}.player-attr input{text-align:center}.player-resource{margin-bottom:14px}.player-meter{height:9px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}.player-meter>div{height:100%}.player-skill{display:grid;grid-template-columns:minmax(0,1fr) 28px 48px 30px;gap:4px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}.player-skill input{padding:4px;width:100%;min-width:0}.player-skill button{padding:4px}.player-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}.player-panel .npc input{min-width:0;width:100%}.player-panel .npc .inline input{flex:1}.player-shell .gm-content{min-width:0}@media(max-width:1050px){.player-columns{grid-template-columns:1fr 1fr}.player-columns>div:last-child{grid-column <title>Forja de Fichas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tela inicial com modelos e fichas salvas; a ficha aberta usa colunas tipo mural, uma seção por cartão. */
:root{
  --bg:#edf1ee; --surface:#fbfcfb; --surface-2:#f0f4f1; --ink:#18231f; --muted:#59685f; --line:#cdd7d1;
  --accent:#0e7466; --accent-ink:#ffffff; --accent-soft:#d6ede8; --danger:#b3261e; --danger-soft:#f9dedc; --warn:#8a5a00; --warn-soft:#fbeccd;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#18211d; --surface-2:#1f2b26; --ink:#e5eee9; --muted:#93a59b; --line:#2f3f38;
    --accent:#44c9b4; --accent-ink:#06201b; --accent-soft:#17342e; --danger:#ff8a80; --danger-soft:#3a1d1b; --warn:#f0c76a; --warn-soft:#3b2f12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211d; --surface-2:#1f2b26; --ink:#e5eee9; --muted:#93a59b; --line:#2f3f38;
  --accent:#44c9b4; --accent-ink:#06201b; --accent-soft:#17342e; --danger:#ff8a80; --danger-soft:#3a1d1b; --warn:#f0c76a; --warn-soft:#3b2f12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--font-body);
  padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#root{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.lead{max-width:62ch;color:var(--muted);margin:.6rem 0 0}
.lbl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint{font-size:.8rem;color:var(--muted)}
.sys{font-family:var(--font-mono);font-size:.72rem;color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.45rem .8rem;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.small{padding:.25rem .55rem;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.4rem .55rem;width:100%;min-width:0}
input[type=checkbox]{width:1.1rem;height:1.1rem;padding:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:5rem}

/* Home */
.hero{margin-bottom:28px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:14px;margin-top:14px}
.tpl{display:flex;flex-direction:column;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.tpl.blank{border-style:dashed;background:transparent}
.tpl ul{margin:0;padding-left:1.1rem;color:var(--muted);font-size:.88rem;display:grid;gap:.2rem;flex:1}
.saved{margin-top:40px}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 0;border-top:1px solid var(--line)}
.row .grow{flex:1 1 200px;min-width:0}
.row .grow b{font-weight:600}
.empty{border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted);margin-top:12px}
.warn{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:10px 14px;margin-bottom:16px}
details.backup{margin-top:32px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
details.backup summary{cursor:pointer;font-weight:600}
.backup-body{display:grid;gap:10px;margin-top:12px}
.backup textarea{font-family:var(--font-mono);font-size:.78rem;min-height:4.5rem}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Ficha */
.topbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:18px}
.topbar .name{flex:1 1 220px;font-family:var(--font-display);font-size:1.3rem;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.45rem .9rem;font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.savestate{font-size:.78rem;color:var(--muted)}
.sections{column-width:360px;column-gap:16px}
.sec{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 6px;margin:0 0 16px;display:block}
.sec.long{break-inside:auto}
.sec-title{font:700 .8rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 .8rem}
.sec-body{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding-bottom:10px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s6{grid-column:span 6}
.field{display:grid;gap:.25rem;align-content:start;min-width:0}
.check{display:flex;gap:.5rem;align-items:center;padding-top:1.1rem}
.attr{display:grid;gap:.2rem;justify-items:center;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--surface-2);align-content:start}
.attr input{text-align:center;font:700 1.5rem var(--font-mono);padding:.15rem;border-color:transparent;background:transparent}
.attr input:focus-visible{border-color:var(--accent)}
.mod{font:700 .95rem var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:.05rem .65rem}
.calc{font:700 1.3rem var(--font-mono);padding:.1rem 0}
.calc.err{color:var(--danger);font-size:1rem}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar-head .num{font:700 .95rem var(--font-mono)}
.barline{display:flex;gap:.35rem;align-items:center}
.barline input{text-align:center;font-family:var(--font-mono)}
.barline .btn{padding:.35rem .65rem}
.track{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.sk-head,.sk-row{display:grid;grid-template-columns:2.7rem minmax(0,1fr) 5.8rem 3.2rem;gap:6px;align-items:center}
.sk-head.nolv,.sk-row.nolv{grid-template-columns:2.7rem minmax(0,1fr) 3.2rem}
.sk-row{padding:3px 0;border-top:1px solid var(--line)}
.sk-total{font:700 1rem var(--font-mono);text-align:center}
.sk-name{display:grid;line-height:1.2;min-width:0}
.sk-sub{font:500 .7rem var(--font-mono);color:var(--muted)}
.sk-row select,.sk-row input{padding:.25rem .3rem;font-size:.82rem}
.sk-row input{text-align:center}
.tbl-head,.tbl-row{display:grid;gap:5px;align-items:center}
.tbl-row input{padding:.3rem .4rem;font-size:.85rem}
.tbl-row .btn{padding:.2rem 0}
.tbl-head{margin-top:2px}

/* Montar */
.fedit{border:1px dashed var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;margin-bottom:10px;background:var(--surface-2)}
.fedit-head{display:flex;align-items:center;gap:6px}
.spacer{flex:1}
.tag{font:700 .7rem var(--font-mono);text-transform:uppercase;color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mono{font-family:var(--font-mono);font-size:.85rem}
.addrow{display:flex;gap:8px;margin:2px 0 12px}
.addrow select{flex:1}
.sec-head{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.sec-head input{font-weight:600}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 4rem auto;gap:6px;align-items:center}
.help{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
.help summary{cursor:pointer;font-weight:600}
.help code{font-family:var(--font-mono);background:var(--surface-2);padding:0 .3rem;border-radius:4px}
.help ul{margin:.5rem 0 0;padding-left:1.1rem;display:grid;gap:.25rem}
@media (max-width:520px){.two{grid-template-columns:1fr}}

/* Site: navegação, landing, campanhas, mestre, jogadores */
a{color:var(--accent)}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
.pill{font:600 .72rem var(--font-mono);padding:.1rem .55rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{display:inline-flex;align-items:center;gap:8px;font:700 1.15rem var(--font-display);text-decoration:none;color:var(--ink)}
.brand svg{color:var(--accent)}
.nav-links{display:flex;flex-wrap:wrap;gap:2px;margin-left:auto}
.nav-links a{padding:.35rem .7rem;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.nav-links a:hover{color:var(--ink)}
.nav-links a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.page-head{margin-bottom:24px}
.page-head h1{font-size:clamp(1.9rem,5vw,2.6rem)}
.note{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:.82rem;color:var(--muted);margin:0 0 18px}
.band{margin-top:56px}
.band>h2{margin-bottom:4px}
.inline-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.land{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:36px;align-items:center;padding:12px 0 4px}
.land h1{font-size:clamp(2.4rem,7vw,4.2rem);letter-spacing:-.03em}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.dice-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;justify-items:center;text-align:center}
.dice-face{position:relative;width:150px;height:150px;display:grid;place-items:center;color:var(--accent)}
.dice-face svg{position:absolute;inset:0;width:100%;height:100%}
.dice-face span{position:relative;font:700 2.6rem var(--font-mono);color:var(--ink)}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:16px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:.6rem}
.side ul{margin:0;padding-left:1.1rem;display:grid;gap:.25rem;color:var(--muted);flex:1}
.side .inline-links{margin-top:6px}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin-top:16px}
.sys-card{border-top:2px solid var(--accent);padding-top:10px;display:grid;gap:.3rem;align-content:start}
.sys-card p{margin:0;color:var(--muted);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px;margin-top:16px}
.step{border-top:2px solid var(--line);padding-top:10px;display:grid;gap:.25rem}
.step .n{font:700 .8rem var(--font-mono);color:var(--accent)}
.step p{margin:0;color:var(--muted)}
.closing{margin-top:56px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:.4rem;justify-items:start}
.foot-site{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}

.roller{display:grid;gap:12px}
.dice-row{display:flex;flex-wrap:wrap;gap:6px}
.dice-row .btn{font-family:var(--font-mono);font-weight:700;min-width:3.4rem}
.rollopts{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.rollopts .field{width:5.5rem}
.rollopts .field.wide{width:9rem}
.result{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:3rem}
.result b{font:700 2.4rem var(--font-mono);line-height:1}
.log{display:grid;gap:2px;font:500 .8rem var(--font-mono);color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .8rem;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}
.camp{display:flex;flex-direction:column;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.camp p{margin:0;color:var(--muted);font-size:.9rem}
.camp .foot{margin-top:auto;padding-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:1rem;margin-bottom:.6rem}
.panel>.hint:first-of-type{margin-top:-.3rem}
.cast>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:.4rem 0;border-top:1px solid var(--line)}
.tl{display:grid;gap:14px;border-left:2px solid var(--line);padding-left:16px;margin:0}
.tl b{display:block}
.tl span{color:var(--muted);font-size:.9rem}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start;margin-top:18px}

.ini-add{display:grid;grid-template-columns:minmax(0,1fr) 4.5rem 4.5rem auto;gap:6px;margin-bottom:12px}
.ini-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ini-row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:.4rem .5rem;border-radius:8px;border:1px solid transparent}
.ini-row.now{background:var(--accent-soft);border-color:var(--accent)}
.ini-n{font:700 1rem var(--font-mono);text-align:center}
.hpbox{display:flex;align-items:center;gap:4px;font:700 .95rem var(--font-mono)}
.hpbox .btn{padding:.1rem .5rem}
.todo{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0}
.todo input{margin-top:.2rem;flex:none}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.npc{padding:.55rem 0;border-top:1px solid var(--line);display:grid;gap:.15rem}
.npc p{margin:0;color:var(--muted);font-size:.88rem}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:.6rem 0;border-top:1px solid var(--line)}
.crow .grow{flex:1 1 200px;min-width:0}
@media (max-width:820px){.land{grid-template-columns:1fr;gap:24px}.detail{grid-template-columns:1fr}}
@media (max-width:480px){.ini-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ini-add input:first-child{grid-column:1/-1}.ini-row{grid-template-columns:2rem minmax(0,1fr) auto}.ini-row .rm{grid-column:3}}

.dice-card{grid-template-columns:minmax(0,1fr) minmax(100px,.65fr);align-items:center;text-align:left;gap:18px}.dice-main{display:grid;justify-items:center;gap:12px}.dice-history{border-left:1px solid var(--line);padding-left:14px;align-self:stretch;display:flex;flex-direction:column;gap:8px}.dice-history .log{gap:6px}.roll-entry{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);padding:7px 9px;border-radius:6px}.gm-shell{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}.gm-side{display:flex;flex-direction:column;gap:5px}.gm-side button{text-align:left;border:0;background:transparent;padding:10px;border-radius:7px}.gm-side button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}.gm-content{min-width:0;display:grid;gap:12px;align-content:start}.gm-banner{background:var(--accent-soft);border-radius:12px;padding:18px}.gm-banner h2{margin:8px 0}.gm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gm-stats b{display:block;font-size:1.5rem;margin-bottom:8px}.gm-progress{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin:10px 0}.gm-progress div{height:100%;background:var(--accent)}.gm-person{display:flex;gap:10px;align-items:center;padding:8px 0}.gm-people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}.gm-people-grid .gm-person{min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.gm-people-grid .gm-person .grow{min-width:0;overflow:hidden}.gm-people-grid .gm-person .grow b,.gm-people-grid .gm-person .hint{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gm-people-grid .gm-person .btn{flex-shrink:0}.gm-people-grid .gm-person .gm-avatar{flex-shrink:0}@media(max-width:780px){.gm-people-grid{grid-template-columns:1fr}}.gm-avatar{background:var(--surface-2);border-radius:8px;padding:8px 12px}.gm-person .grow{flex:1}.gm-top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.gm-content .panel{background:var(--bg)}@media(max-width:650px){.gm-shell{grid-template-columns:1fr;padding:10px}.gm-side{flex-direction:row;overflow-x:auto}.gm-side button{white-space:nowrap}.gm-top{grid-column:auto}.dice-card{gap:10px;padding:12px}.dice-face{width:110px;height:110px}}

/* Rodapé ao fundo, sem sobrepor conteúdo */
body{padding-bottom:20px}
#root{min-height:calc(100dvh - 44px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}

<script id="logic">
/* ---------- utilidades ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const num=(v)=>{const n=parseFloat(String(v===undefined||v===null?'':v).replace(',','.'));return Number.isFinite(n)?n:0;};
const fmt=(v)=>String(Math.round(v*100)/100);
const fmtSigned=(n)=>(n>=0?'+':'−')+fmt(Math.abs(n));
const slug=(s)=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'campo';
const cleanKey=(v)=>String(v).toLowerCase().replace(/[^a-z0-9_]/g,'');

/* ---------- fórmulas ---------- */
const FUNCS={
  floor:Math.floor,ceil:Math.ceil,round:Math.round,abs:Math.abs,max:Math.max,min:Math.min,
  ge:(a,b)=>a>=b?1:0,
  pick:(i,...xs)=>(i>=1&&i<=xs.length)?xs[i-1]:0
};
const CC=new Map();
function compile(src){
  const s=String(src||'');let i=0;
  const ws=()=>{while(i<s.length&&s[i]===' ')i++;};
  const bin=(op,l,r)=>op==='+'?(g=>l(g)+r(g)):op==='-'?(g=>l(g)-r(g)):op==='*'?(g=>l(g)*r(g)):(g=>{const d=r(g);return d===0?0:l(g)/d;});
  function expr(){let v=term();ws();while(s[i]==='+'||s[i]==='-'){const op=s[i++];v=bin(op,v,term());ws();}return v;}
  function term(){let v=unary();ws();while(s[i]==='*'||s[i]==='/'){const op=s[i++];v=bin(op,v,unary());ws();}return v;}
  function unary(){
    ws();
    if(s[i]==='-'){i++;const v=unary();return g=>-v(g);}
    if(s[i]==='+'){i++;return unary();}
    return atom();
  }
  function atom(){
    ws();
    if(s[i]==='('){i++;const v=expr();ws();if(s[i]!==')')throw new Error('Falta fechar )');i++;return v;}
    let m=/^\d+(\.\d+)?/.exec(s.slice(i));
    if(m){i+=m[0].length;const n=parseFloat(m[0]);return ()=>n;}
    m=/^[a-z_][a-z0-9_]*/i.exec(s.slice(i));
    if(m){
      const name=m[0].toLowerCase();i+=m[0].length;ws();
      if(s[i]==='('){
        i++;const args=[];ws();
        if(s[i]!==')'){for(;;){args.push(expr());ws();if(s[i]===','){i++;continue;}break;}}
        if(s[i]!==')')throw new Error('Falta fechar )');
        i++;
        const fn=FUNCS[name];
        if(!fn)throw new Error('Função desconhecida: '+name);
        return g=>fn(...args.map(a=>a(g)));
      }
      return g=>g(name);
    }
    throw new Error('Fórmula inválida');
  }
  const out=expr();ws();
  if(i<s.length)throw new Error('Sobrou texto na fórmula');
  return out;
}
function evalFormula(src,get){
  let fn=CC.get(src);
  if(!fn){fn=compile(src);CC.set(src,fn);}
  const v=fn(get);
  return Number.isFinite(v)?v:0;
}
function tryCalc(src,get){try{return {ok:true,v:evalFormula(src,get)};}catch(e){return {ok:false,err:e.message};}}

/* ---------- cálculo da ficha ---------- */
const LEVELS={dnd:['—','Prof.','Esp.'],t20:['—','Treinado'],ordem:['—','Treinado','Veterano','Expert'],simples:null};
const ORDEM_BONUS=[0,5,10,15];
function barMax(f,data,get){return f.maxFormula?evalFormula(f.maxFormula,get):num((data[f.id]||{}).max);}
function barCur(f,data,get){const d=data[f.id]||{};return (d.cur===undefined||d.cur==='')?barMax(f,data,get):num(d.cur);}
function skillTotal(f,it,data,get){
  const d=(data[f.id]||{})[it.id]||{};
  const t=d.t||0,b=num(d.b);
  if(f.rule==='dnd'){const p=f.profKey?get(f.profKey):0;return get(it.attr+'_mod')+(t===1?p:t===2?2*p:0)+b;}
  if(f.rule==='t20'){const half=f.levelKey?Math.floor(get(f.levelKey)/2):0;return half+get(it.attr)+(t?(f.profKey?get(f.profKey):0):0)+b;}
  if(f.rule==='ordem')return (ORDEM_BONUS[t]||0)+b;
  return get(it.attr+'_mod')+b;
}
function evalEntry(e,data,get){
  const f=e.f,raw=data[f.id];
  if(e.kind==='skill')return skillTotal(f,e.it,data,get);
  if(e.kind==='mod'){const sc=num(raw);return f.modRule==='dnd'?Math.floor((sc-10)/2):sc;}
  if(e.kind==='max')return barMax(f,data,get);
  switch(f.type){
    case 'number':case 'attr':case 'select':return num(raw);
    case 'check':return raw?1:0;
    case 'bar':return barCur(f,data,get);
    case 'calc':return evalFormula(f.formula,get);
    default:return 0;
  }
}
function makeCtx(sheet){
  const idx={};
  const put=(k,v)=>{if(k)idx[String(k).toLowerCase()]=v;};
  for(const sec of sheet.sections)for(const f of sec.fields){
    put(f.key,{f,kind:'main'});
    if(f.key&&f.type==='attr')put(f.key+'_mod',{f,kind:'mod'});
    if(f.key&&f.type==='bar')put(f.key+'_max',{f,kind:'max'});
    if(f.type==='skills')for(const it of f.items)put(it.k,{f,it,kind:'skill'});
  }
  const memo={},busy={},data=sheet.data||{};
  const get=(k)=>{
    k=String(k).toLowerCase();
    if(k in memo)return memo[k];
    const e=idx[k];
    if(!e||busy[k])return 0;
    busy[k]=true;
    let v=0;
    try{v=evalEntry(e,data,get);}catch(err){v=0;}
    busy[k]=false;memo[k]=v;
    return v;
  };
  return {get,idx};
}

/* ---------- construtores de campos ---------- */
const mkf=(type,label,key,x)=>Object.assign({id:uid(),type,label,key:key||''},x||{});
const fText=(l,k,d)=>mkf('text',l,k,d===undefined?{}:{def:d});
const fNum=(l,k,d)=>mkf('number',l,k,d===undefined?{}:{def:d});
const fLong=(l)=>mkf('longtext',l,'');
const fAttr=(l,k,rule,d)=>mkf('attr',l,k,{modRule:rule,def:d});
const fBar=(l,k,x)=>mkf('bar',l,k,Object.assign({maxFormula:''},x||{}));
const fSel=(l,k,opts,d)=>mkf('select',l,k,{options:opts,def:d});
const fCalc=(l,k,f)=>mkf('calc',l,k,{formula:f});
const fList=(l,cols)=>mkf('list',l,'',{cols});
const skItems=(prefix,arr)=>arr.map(([name,attr])=>({id:uid(),name,attr,k:prefix+slug(name)}));
const fSkills=(l,rule,items,x)=>mkf('skills',l,'',Object.assign({rule,items},x||{}));
const mksec=(title,...fields)=>({id:uid(),title,fields});
const blankRow=(f)=>({id:uid(),c:(f.cols||[]).map(()=>'')});
function initData(sections){
  const d={};
  sections.forEach(s=>s.fields.forEach(f=>{
    if(f.def!==undefined)d[f.id]=f.def;
    if(f.type==='list')d[f.id]=[blankRow(f),blankRow(f)];
  }));
  return d;
}

/* ---------- tipos de campo (editor) ---------- */
const TYPE_LABEL={text:'Texto curto',number:'Número',longtext:'Texto longo',check:'Marcação',attr:'Atributo',bar:'Barra atual/máx.',select:'Lista de opções',calc:'Cálculo',skills:'Perícias',list:'Tabela'};
const TYPE_ORDER=['text','number','longtext','check','attr','bar','select','calc','skills','list'];
function newField(type,secs){
  const used=new Set();
  secs.forEach(s=>s.fields.forEach(f=>{if(f.key)used.add(f.key);if(f.type==='skills')f.items.forEach(i=>used.add(i.k));}));
  const base={text:'texto',number:'numero',longtext:'notas',check:'marcacao',attr:'atributo',bar:'barra',select:'opcao',calc:'calculo',skills:'pericias',list:'tabela'}[type];
  let k=base,n=2;
  while(used.has(k))k=base+(n++);
  const key=(type==='longtext'||type==='list'||type==='skills')?'':k;
  const f=mkf(type,'Novo campo',key);
  if(type==='attr')f.modRule='none';
  if(type==='bar')f.maxFormula='';
  if(type==='select')f.options=['Opção 1','Opção 2'];
  if(type==='calc')f.formula='0';
  if(type==='skills'){f.rule='simples';f.profKey='';f.levelKey='';f.items=[{id:uid(),name:'Nova perícia',attr:'',k:'p_'+uid().slice(0,4)}];}
  if(type==='list')f.cols=['Nome','Qtd'];
  return f;
}

/* ---------- modelos ---------- */
const DND_ATTR=[['Força','for'],['Destreza','des'],['Constituição','con'],['Inteligência','int'],['Sabedoria','sab'],['Carisma','car']];
const DND_SKILLS=[['Acrobacia','des'],['Adestrar Animais','sab'],['Arcanismo','int'],['Atletismo','for'],['Atuação','car'],['Enganação','car'],['Furtividade','des'],['História','int'],['Intimidação','car'],['Intuição','sab'],['Investigação','int'],['Medicina','sab'],['Natureza','int'],['Percepção','sab'],['Persuasão','car'],['Prestidigitação','des'],['Religião','int'],['Sobrevivência','sab']];
const ORDEM_ATTR=[['Agilidade','agi'],['Força','for'],['Intelecto','int'],['Presença','pre'],['Vigor','vig']];
const ORDEM_SKILLS=[['Acrobacia','agi'],['Adestramento','pre'],['Artes','pre'],['Atletismo','for'],['Atualidades','int'],['Ciências','int'],['Crime','agi'],['Diplomacia','pre'],['Enganação','pre'],['Fortitude','vig'],['Furtividade','agi'],['Iniciativa','agi'],['Intimidação','pre'],['Intuição','pre'],['Investigação','int'],['Luta','for'],['Medicina','int'],['Ocultismo','int'],['Percepção','pre'],['Pilotagem','agi'],['Pontaria','agi'],['Profissão','int'],['Reflexos','agi'],['Religião','pre'],['Sobrevivência','int'],['Tática','int'],['Tecnologia','int'],['Vontade','pre']];
const T20_ATTR=[['Força','for'],['Destreza','des'],['Constituição','con'],['Inteligência','int'],['Sabedoria','sab'],['Carisma','car']];
const T20_SKILLS=[['Acrobacia','des'],['Adestramento','car'],['Atletismo','for'],['Atuação','car'],['Cavalgar','des'],['Conhecimento','int'],['Cura','sab'],['Diplomacia','car'],['Enganação','car'],['Fortitude','con'],['Furtividade','des'],['Guerra','int'],['Iniciativa','des'],['Intimidação','car'],['Intuição','sab'],['Investigação','int'],['Jogatina','car'],['Ladinagem','des'],['Luta','for'],['Misticismo','int'],['Nobreza','int'],['Ofício','int'],['Percepção','sab'],['Pilotagem','des'],['Pontaria','des'],['Reflexos','des'],['Religião','sab'],['Sobrevivência','sab'],['Vontade','sab']];

function buildDnd(){
  return [
    mksec('Personagem',fText('Nome do personagem','nome'),fText('Classe','classe'),fText('Raça','raca'),fText('Antecedente','antecedente'),fText('Alinhamento','alinhamento'),fNum('Nível','nivel',1),fNum('Pontos de experiência','xp',0)),
    mksec('Atributos',...DND_ATTR.map(([l,k])=>fAttr(l,k,'dnd',10))),
    mksec('Combate',fCalc('Bônus de proficiência','prof','floor((nivel-1)/4)+2'),fCalc('Iniciativa','iniciativa','des_mod'),fNum('Classe de Armadura','ca',10),fText('Deslocamento','desloc','9 m'),fCalc('Percepção passiva','percepcao_passiva','10 + per_percepcao'),fText('Dados de vida','dv'),fBar('Pontos de vida','pv',{def:{max:10}})),
    mksec('Salvaguardas',fSkills('Salvaguardas','dnd',DND_ATTR.map(([n,a])=>({id:uid(),name:n,attr:a,k:'salv_'+a})),{profKey:'prof'})),
    mksec('Perícias',fSkills('Perícias','dnd',skItems('per_',DND_SKILLS),{profKey:'prof'})),
    mksec('Ataques',fList('Ataques e truques',['Nome','Bônus','Dano / tipo'])),
    mksec('Magias',fList('Magias preparadas',['Magia','Nível','Notas'])),
    mksec('Equipamento',fList('Itens',['Item','Qtd','Peso']),fNum('Peças de ouro','po',0)),
    mksec('Características e talentos',fLong('Características de classe, raça e talentos')),
    mksec('Personalidade',fLong('Traços, ideais, laços e defeitos'),fLong('História')),
    mksec('Anotações',fLong('Anotações da campanha'))
  ];
}
function buildOrdem(){
  return [
    mksec('Personagem',fText('Nome','nome'),fText('Jogador','jogador'),fText('Origem','origem'),fSel('Classe','classe',['Combatente','Especialista','Ocultista'],1),fText('Trilha','trilha'),fNum('NEX (1 a 20: 1 = 5%, 20 = 99%)','nex',1),fCalc('NEX em %','nex_pct','min(nex*5, 99)')),
    mksec('Atributos',...ORDEM_ATTR.map(([l,k])=>fAttr(l,k,'none',1))),
    mksec('Condição',
      fBar('Pontos de Vida','pv',{maxFormula:'pick(classe,20,16,12)+vig+(pick(classe,4,3,2)+vig)*(nex-1)'}),
      fBar('Pontos de Esforço','pe',{maxFormula:'(pick(classe,2,3,4)+pre)*nex'}),
      fBar('Sanidade','san',{maxFormula:'pick(classe,12,16,20)+pick(classe,3,4,5)*(nex-1)'}),

    mksec('Habilidades',fLong('Habilidades de classe, trilha e origem')),
    mksec('Anotações',fLong('Investigação e anotações'))
  ];
}
function buildT20(){
  return [
    mksec('Personagem',fText('Nome','nome'),fText('Raça','raca'),fText('Classe','classe'),fText('Origem','origem'),fText('Divindade','divindade'),fNum('Nível','nivel',1),fCalc('Bônus de treino','treino','2 + 2*ge(nivel,7) + 2*ge(nivel,15)')),
    mksec('Atributos',...T20_ATTR.map(([l,k])=>fAttr(l,k,'none',0))),
    mksec('Combate',fBar('Pontos de Vida','pv',{def:{max:10}}),fBar('Pontos de Mana','pm',{def:{max:1}}),fNum('Bônus de armadura e escudo','armadura',0),fCalc('Defesa','defesa','10 + floor(nivel/2) + des + armadura'),fText('Deslocamento','desloc','9 m')),
    mksec('Perícias',fSkills('Perícias','t20',skItems('t_',T20_SKILLS),{levelKey:'nivel',profKey:'treino'})),
    mksec('Ataques',fList('Armas',['Arma','Ataque','Dano','Crítico','Alcance'])),
    mksec('Magias',fList('Magias',['Magia','Custo (PM)','Alcance / duração'])),
    mksec('Poderes',fLong('Poderes de classe, raça e origem')),
    mksec('Inventário',fList('Itens',['Item','Espaços']),fNum('Tibares (T$)','tibares',0)),
    mksec('Anotações',fLong('Anotações'))
  ];
}
function buildBlank(){
  return [
    mksec('Identidade',fText('Nome','nome'),fText('Função ou classe','funcao')),
    mksec('Anotações',fLong('Anotações'))
  ];
}
const TEMPLATES=[
  {key:'dnd5e',system:'D&D 5e',title:'Aventureiro de 5ª edição',defaultName:'Novo personagem D&D',

<script id="ui">
const {useState,useEffect,useMemo,useRef}=React;
const h=React.createElement;
const E=(tag)=>(p,...c)=>h(tag,p,...c);
const div=E('div'),span=E('span'),btn=E('button'),inp=E('input'),sel=E('select'),opt=E('option'),area=E('textarea'),lab=E('label'),
  h1=E('h1'),h2=E('h2'),h3=E('h3'),para=E('p'),sect=E('section'),hdr=E('header'),det=E('details'),summ=E('summary'),ul=E('ul'),li=E('li'),code=E('code'),sm=E('small');

const STORE_KEY='forja-fichas-v1';
function loadStore(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.sheets))return o;}}catch(e){}
  return {sheets:[]};
}
const mapSec=(id,fn)=>(secs)=>secs.map(s=>s.id===id?fn(s):s);
const moveArr=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return arr;const a=arr.slice();const t=a[i];a[i]=a[j];a[j]=t;return a;};

function Confirm({label,onYes}){
  const [armed,setArmed]=useState(false);
  useEffect(()=>{if(!armed)return undefined;const t=setTimeout(()=>setArmed(false),3000);return ()=>clearTimeout(t);},[armed]);
  return btn({type:'button',className:'btn small'+(armed?' danger':''),onClick:()=>{if(armed){setArmed(false);onYes();}else setArmed(true);}},armed?'Confirmar?':label);
}
function Commit({value,onCommit,...rest}){
  const [v,setV]=useState(value);
  useEffect(()=>{setV(value);},[value]);
  return inp({...rest,value:v,onChange:e=>setV(e.target.value),onBlur:()=>onCommit(v),onKeyDown:e=>{if(e.key==='Enter')e.target.blur();}});
}

/* ---------- ficha: modo preencher ---------- */
function ListField({f,data,setVal}){
  const rows=Array.isArray(data[f.id])?data[f.id]:[];
  const cols=f.cols||[];
  const tpl={gridTemplateColumns:cols.map((_,i)=>i===0?'minmax(0,2fr)':'minmax(0,1fr)').join(' ')+' 1.8rem'};
  const setCell=(r,i,v)=>{const c=cols.map((_,j)=>(r.c||[])[j]||'');c[i]=v;setVal(f.id,rows.map(x=>x.id===r.id?{...x,c}:x));};
  return div({className:'field'},
    span({className:'lbl'},f.label),
    div({className:'tbl-head',style:tpl},cols.map((c,i)=>span({key:i,className:'hint'},c)),span(null,'')),
    rows.map(r=>div({key:r.id,className:'tbl-row',style:tpl},
      cols.map((c,i)=>inp({key:i,type:'text','aria-label':c,value:(r.c||[])[i]||'',onChange:e=>setCell(r,i,e.target.value)})),
      btn({type:'button',className:'btn small','aria-label':'Remover linha',onClick:()=>setVal(f.id,rows.filter(x=>x.id!==r.id))},'×'))),
    div(null,btn({type:'button',className:'btn small',onClick:()=>setVal(f.id,[...rows,blankRow(f)])},'+ Linha')));
}
function SkillsField({f,ctx,data,setVal}){
  const lv=LEVELS[f.rule]||null;
  const st=data[f.id]||{};
  const setSk=(id,p)=>setVal(f.id,{...st,[id]:{...(st[id]||{}),...p}});
  const cls=lv?'':' nolv';
  return div({className:'field'},
    span({className:'lbl'},f.label),
    div({className:'sk-head hint'+cls},span(null,'Total'),span(null,'Perícia'),lv?span(null,'Treino'):null,span(null,'Extra')),
    f.items.map(it=>{
      const d=st[it.id]||{};
      const total=skillTotal(f,it,data,ctx.get);
      let sub=(it.attr||'').toUpperCase();
      if(f.rule==='ordem'){const n=ctx.get(it.attr);sub+=' · '+(n>0?n+'d20':'2d20 (pior)');}
      return div({key:it.id,className:'sk-row'+cls},
        div({className:'sk-total'},fmtSigned(total)),
        div({className:'sk-name'},span(null,it.name),span({className:'sk-sub'},sub)),
        lv?sel({'aria-label':'Treino em '+it.name,value:d.t||0,onChange:e=>setSk(it.id,{t:Number(e.target.value)})},lv.map((o,i)=>opt({key:i,value:i},o))):null,
        inp({type:'number','aria-label':'Bônus extra em '+it.name,value:d.b===undefined?'':d.b,onChange:e=>setSk(it.id,{b:e.target.value})}));
    }));
}
function BarField({f,ctx,data,setVal}){
  const d=data[f.id]||{};
  const max=barMax(f,data,ctx.get);
  const cur=(d.cur===undefined||d.cur==='')?max:num(d.cur);
  const setCur=(v)=>setVal(f.id,{...d,cur:v});
  const pct=max>0?Math.max(0,Math.min(100,cur/max*100)):0;
  return div({className:'field'},
    div({className:'bar-head'},span({className:'lbl'},f.label),span({className:'num'},fmt(cur)+' / '+fmt(max))),
    div({className:'track'},div({className:'fill',style:{width:pct+'%'}})),
    div({className:'barline'},
      btn({type:'button',className:'btn','aria-label':'Diminuir',onClick:()=>setCur(cur-1)},'−'),
      inp({type:'number','aria-label':f.label+' atual',value:d.cur===undefined?'':d.cur,placeholder:fmt(max),onChange:e=>setCur(e.target.value)}),
      span({className:'hint'},'de'),
      f.maxFormula?span({className:'calc',style:{fontSize:'1rem',minWidth:'2.5rem',textAlign:'center'}},fmt(max)):inp({type:'number','aria-label':f.label+' máximo',value:d.max===undefined?'':d.max,onChange:e=>setVal(f.id,{...d,max:e.target.value})}),
      btn({type:'button',className:'btn','aria-label':'Aumentar',onClick:()=>setCur(cur+1)},'+')));
}
function FillField({f,ctx,data,setVal}){
  const v=data[f.id];
  switch(f.type){
    case 'text':return div({className:'field'},span({className:'lbl'},f.label),inp({type:'text',value:v===undefined?'':v,onChange:e=>setVal(f.id,e.target.value)}));
    case 'number':return div({className:'field'},span({className:'lbl'},f.label),inp({type:'number',value:v===undefined?'':v,onChange:e=>setVal(f.id,e.target.value)}));
    case 'longtext':return div({className:'field'},span({className:'lbl'},f.label),area({value:v===undefined?'':v,onChange:e=>setVal(f.id,e.target.value)}));
    case 'check':return lab({className:'check'},inp({type:'checkbox',checked:!!v,onChange:e=>setVal(f.id,e.target.checked)}),f.label);
    case 'select':return div({className:'field'},span({className:'lbl'},f.label),sel({value:v||0,onChange:e=>setVal(f.id,Number(e.target.value))},opt({value:0},'—'),(f.options||[]).map((o,i)=>opt({key:i,value:i+1},o))));
    case 'attr':return div({className:'attr'},span({className:'lbl'},f.label),inp({type:'number','aria-label':f.label,value:v===undefined?'':v,onChange:e=>setVal(f.id,e.target.value)}),f.modRule==='dnd'?span({className:'mod'},fmtSigned(Math.floor((num(v)-10)/2))):null);
    case 'calc':{const r=tryCalc(f.formula,ctx.get);return div({className:'field'},span({className:'lbl'},f.label),div({className:'calc'+(r.ok?'':' err'),title:r.ok?'':r.err},r.ok?fmt(r.v):'Fórmula com erro'));}
    case 'bar':return h(BarField,{f,ctx,data,setVal});
    case 'skills':return h(SkillsField,{f,ctx,data,setVal});
    case 'list':return h(ListField,{f,data,setVal});
    default:return null;
  }
}
const spanOf=(f)=>f.type==='attr'?'s2':(f.type==='bar'||f.type==='longtext'||f.type==='skills'||f.type==='list')?'s6':'s3';
function FillSection({sec,ctx,data,setVal}){
  const long=sec.fields.some(f=>f.type==='skills');
  return sect({className:'sec'+(long?' long':'')},
    sec.title?h2({className:'sec-title'},sec.title):null,
    sec.fields.length===0?para({className:'hint'},'Seção vazia. Use o modo Montar para adicionar campos.'):
    div({className:'sec-body'},sec.fields.map(f=>div({key:f.id,className:spanOf(f)},h(FillField,{f,ctx,data,setVal})))));
}

/* ---------- ficha: modo montar ---------- */
const RULE_LABEL={simples:'Simples (modificador + extra)',dnd:'D&D 5e (proficiência)',t20:'Tormenta20 (½ nível + treino)',ordem:'Ordem Paranormal (treino +5/+10/+15)'};
function FieldEditor({f,i,n,secId,setLayout}){
  const patch=(p)=>setLayout(mapSec(secId,s=>({...s,fields:s.fields.map(x=>x.id===f.id?{...x,...p}:x)})));
  const move=(d)=>setLayout(mapSec(secId,s=>({...s,fields:moveArr(s.fields,i,d)})));
  const del=()=>setLayout(mapSec(secId,s=>({...s,fields:s.fields.filter(x=>x.id!==f.id)})));
  const hasKey=f.type!=='longtext'&&f.type!=='list'&&f.type!=='skills';
  const items=f.items||[];
  const patchItem=(id,p)=>patch({items:items.map(it=>it.id===id?{...it,...p}:it)});
  return div({className:'fedit'},
    div({className:'fedit-head'},span({className:'tag'},TYPE_LABEL[f.type]),div({className:'spacer'}),
      btn({type:'button',className:'btn small','aria-label':'Mover para cima',disabled:i===0,onClick:()=>move(-1)},'↑'),
      btn({type:'button',className:'btn small','aria-label':'Mover para baixo',disabled:i===n-1,onClick:()=>move(1)},'↓'),
      h(Confirm,{label:'Remover',onYes:del})),
    div({className:hasKey?'two':''},
      lab({className:'field'},span({className:'lbl'},'Rótulo'),inp({type:'text',value:f.label,onChange:e=>patch({label:e.target.value})})),
      hasKey?lab({className:'field'},span({className:'lbl'},'Chave para fórmulas'),inp({type:'text',className:'mono',value:f.key||'',onChange:e=>patch({key:cleanKey(e.target.value)})})):null),
    f.type==='attr'?lab({className:'field'},span({className:'lbl'},'Modificador'),sel({value:f.modRule||'none',onChange:e=>patch({modRule:e.target.value})},opt({value:'none'},'Nenhum (o valor já é o modificador)'),opt({value:'dnd'},'Estilo D&D: (valor − 10) ÷ 2'))):null,
    f.type==='bar'?lab({className:'field'},span({className:'lbl'},'Máximo calculado (opcional)'),inp({type:'text',className:'mono',placeholder:'vazio = você digita o máximo',value:f.maxFormula||'',onChange:e=>patch({maxFormula:e.target.value})})):null,
    f.type==='calc'?lab({className:'field'},span({className:'lbl'},'Fórmula'),inp({type:'text',className:'mono',value:f.formula||'',onChange:e=>patch({formula:e.target.value})})):null,
    f.type==='select'?lab({className:'field'},span({className:'lbl'},'Opções, separadas por vírgula'),h(Commit,{type:'text',value:(f.options||[]).join(', '),onCommit:v=>patch({options:v.split(',').map(x=>x.trim()).filter(Boolean)})})):null,
    f.type==='list'?lab({className:'field'},span({className:'lbl'},'Colunas, separadas por vírgula'),h(Commit,{type:'text',value:(f.cols||[]).join(', '),onCommit:v=>patch({cols:v.split(',').map(x=>x.trim()).filter(Boolean)})})):null,
    f.type==='skills'?div({className:'field'},
      lab({className:'field'},span({className:'lbl'},'Regra de cálculo'),sel({value:f.rule,onChange:e=>patch({rule:e.target.value})},Object.keys(RULE_LABEL).map(k=>opt({key:k,value:k},RULE_LABEL[k])))),
      (f.rule==='dnd'||f.rule==='t20')?div({className:'two'},
        lab({className:'field'},span({className:'lbl'},f.rule==='dnd'?'Chave do bônus de proficiência':'Chave do bônus de treino'),inp({type:'text',className:'mono',value:f.profKey||'',onChange:e=>patch({profKey:cleanKey(e.target.value)})})),
        f.rule==='t20'?lab({className:'field'},span({className:'lbl'},'Chave do nível'),inp({type:'text',className:'mono',value:f.levelKey||'',onChange:e=>patch({levelKey:cleanKey(e.target.value)})})):null):null,
      span({className:'lbl'},'Perícias (nome e chave do atributo)'),
      items.map((it,j)=>div({key:it.id,className:'item-row'},
        inp({type:'text','aria-label':'Nome da perícia',value:it.name,onChange:e=>patchItem(it.id,{name:e.target.value})}),
        inp({type:'text',className:'mono','aria-label':'Chave do atributo',value:it.attr||'',onChange:e=>patchItem(it.id,{attr:cleanKey(e.target.value)})}),
        btn({type:'button',className:'btn small','aria-label':'Remover perícia',onClick:()=>patch({items:items.filter(x=>x.id!==it.id)})},'×'))),
      div(null,btn({type:'button',className:'btn small',onClick:()=>patch({items:[...items,{id:uid(),name:'Nova perícia',attr:'',k:'p_'+uid().slice(0,4)}]})},'+ Perícia'))):null);
}
function AddField({secId,setLayout}){
  const [t,setT]=useState('text');
  return div({className:'addrow'},
    sel({'aria-label':'Tipo de campo',value:t,onChange:e=>setT(e.target.value)},TYPE_ORDER.map(k=>opt({key:k,value:k},TYPE_LABEL[k]))),
    btn({type:'button',className:'btn small primary',onClick:()=>setLayout(secs=>{const f=newField(t,secs);return secs.map(s=>s.id===secId?{...s,fields:[...s.fields,f]}:s);})},'Adicionar campo'));
}
function BuildSection({sec,i,n,setLayout}){
  return sect({className:'sec long'},
    div({className:'sec-head'},
      inp({type:'text','aria-label':'Título da seção',value:sec.title,onChange:e=>setLayout(mapSec(sec.id,s=>({...s,title:e.target.value})))}),
      btn({type:'button',className:'btn small','aria-label':'Mover seção para cima',disabled:i===0,onClick:()=>setLayout(secs=>moveArr(secs,i,-1))},'↑'),
      btn({type:'button',className:'btn small','aria-label':'Mover seção para baixo',disabled:i===n-1,onClick:()=>setLayout(secs=>moveArr(secs,i,1))},'↓'),
      h(Confirm,{label:'Excluir',onYes:()=>setLayout(secs=>secs.filter(s=>s.id!==sec.id))})),
    sec.fields.map((f,j)=>h(FieldEditor,{key:f.id,f,i:j,n:sec.fields.length,secId:sec.id,setLayout})),
    h(AddField,{secId:sec.id,setLayout}));
}
function FormulaHelp(){
  return det({className:'help'},summ(null,'Como escrever fórmulas'),
    para({className:'hint',style:{margin:'.5rem 0 0'}},'Use a chave de qualquer campo. Atributos estilo D&D também ganham a chave com sufixo _mod. Barras ganham o sufixo _max.'),
    ul(null,
      li(null,code(null,'10 + des_mod'),' soma 10 ao modificador de Destreza.'),

      li(null,code(null,'ge(nivel, 7)'),' vale 1 se nivel ≥ 7, senão 0.'),
      li(null,code(null,'pick(classe, 20, 16, 12)'),' escolhe o 1º, 2º ou 3º número conforme a opção escolhida em uma lista.')));

/* ---------- tela da ficha ---------- */
function SheetView({sheet,update,onBack,initialMode,saveState}){
  const [mode,setMode]=useState(initialMode);
  const ctx=useMemo(()=>makeCtx(sheet),[sheet]);
  const setVal=(fid,v)=>update(sheet.id,s=>({...s,data:{...s.data,[fid]:v},updated:Date.now()}));
  const setLayout=(fn)=>update(sheet.id,s=>({...s,sections:fn(s.sections),updated:Date.now()}));
  const build=mode==='build';
  return div(null,
    div({className:'topbar'},
      btn({type:'button',className:'btn',onClick:onBack},'← Fichas'),
      inp({type:'text',className:'name','aria-label':'Nome da ficha',value:sheet.name,onChange:e=>update(sheet.id,s=>({...s,name:e.target.value}))}),
      div({className:'seg',role:'group','aria-label':'Modo'},
        btn({type:'button','aria-pressed':!build,onClick:()=>setMode('fill')},'Preencher'),
        btn({type:'button','aria-pressed':build,onClick:()=>setMode('build')},'Montar')),
      span({className:'savestate'},saveState==='ok'?'Salvo neste navegador':'Não foi possível salvar')),
    build?h(FormulaHelp):null,
    div({className:'sections'},
      sheet.sections.map((sec,i)=>build
        ?h(BuildSection,{key:sec.id,sec,i,n:sheet.sections.length,setLayout})
        :h(FillSection,{key:sec.id,sec,ctx,data:sheet.data||{},setVal}))),
    build?div({style:{marginTop:'4px'}},btn({type:'button',className:'btn primary',onClick:()=>setLayout(secs=>[...secs,{id:uid(),title:'Nova seção',fields:[]}])},'+ Adicionar seção')):null);
}

function TplCard({t,onCreate}){
  return div({className:'tpl'+(t.key==='blank'?' blank':'')},
    span({className:'sys'},t.system),
    h3(null,t.title),
    para({className:'hint',style:{margin:0}},t.blurb),
    ul(null,t.facts.map((x,i)=>li({key:i},x))),
    btn({type:'button',className:'btn primary',onClick:()=>onCreate(t)},t.key==='blank'?'Montar do zero':'Usar este modelo'));
}
function importSheets(text){
  const o=JSON.parse(text);
  const list=Array.isArray(o)?o:(o&&Array.isArray(o.sheets)?o.sheets:[o]);
  return list.filter(s=>s&&Array.isArray(s.sections)&&s.data&&typeof s.data==='object')
    .map(s=>({...s,id:uid(),name:String(s.name||'Ficha importada'),updated:Date.now()}));
}
function Backup({sheets,onImport}){
  const text=useMemo(()=>JSON.stringify(sheets),[sheets]);
  const [imp,setImp]=useState('');
  const [msg,setMsg]=useState('');
  const ref=useRef(null);
  const copy=()=>{
    const fail=()=>{if(ref.current){ref.current.focus();ref.current.select();}setMsg('Texto selecionado. Copie com Ctrl+C.');};
    try{navigator.clipboard.writeText(text).then(()=>setMsg('Copiado.'),fail);}catch(e){fail();}
  };
  const doImport=()=>{
    try{const list=importSheets(imp);if(!list.length){setMsg('Nenhuma ficha válida no texto.');return;}onImport(list);setImp('');setMsg(list.length+' ficha(s) importada(s).');}
    catch(e){setMsg('Não consegui ler esse texto.');}
  };
  const onFile=(e)=>{const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>setImp(String(r.result||''));r.readAsText(file);};
  return det({className:'backup'},summ(null,'Backup das fichas'),
    div({className:'backup-body'},
      para({className:'hint',style:{margin:0}},'As fichas ficam salvas só neste navegador. Copie o texto abaixo para guardar uma cópia ou levar para outro aparelho.'),
      area({ref,readOnly:true,'aria-label':'Texto do backup',value:text}),
      div({className:'inline'},btn({type:'button',className:'btn small',onClick:copy,disabled:sheets.length===0},'Copiar backup'),span({className:'hint'},msg)),
      area({'aria-label':'Texto para importar',placeholder:'Cole aqui o backup para importar',value:imp,onChange:e=>setImp(e.target.value)}),
      div({className:'inline'},btn({type:'button',className:'btn small',onClick:doImport,disabled:!imp.trim()},'Importar'),inp({type:'file',accept:'.json,application/json','aria-label':'Carregar arquivo de backup',onChange:onFile,style:{width:'auto'}}))));
}

const DICE=[4,6,8,10,12,20,100];
function DiceRoller({compact}){
  const [qty,setQty]=useState(1);
  const [mod,setMod]=useState('0');
  const [adv,setAdv]=useState('normal');
  const [log,setLog]=useState([]);
  const [rolling,setRolling]=useState(false);
  const [preview,setPreview]=useState(20);
  const timers=useRef(null);
  useEffect(()=>()=>{if(timers.current){clearInterval(timers.current.interval);clearTimeout(timers.current.timeout);}},[]);
  const animateRoll=()=>{
    if(timers.current)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){roll(20);return;}
    setRolling(true);setPreview(1+Math.floor(Math.random()*20));
    const interval=setInterval(()=>setPreview(1+Math.floor(Math.random()*20)),85);
    const timeout=setTimeout(()=>{clearInterval(interval);timers.current=null;roll(20);setRolling(false);},850);
    timers.current={interval,timeout};
  };
  const roll=(sides)=>{
    const rr=()=>1+Math.floor(Math.random()*sides);
    const n=compact?1:Math.max(1,Math.min(20,Math.floor(num(qty))||1));
    const m=compact?0:Math.round(num(mod));
    let base,detail='';
    if(sides===20&&n===1&&adv!=='normal'){
      const a=rr(),b=rr();
      base=adv==='vantagem'?Math.max(a,b):Math.min(a,b);
      detail=a+' e '+b+' ('+adv+')';
    }else{
      const rolls=[];
      for(let i=0;i<n;i++)rolls.push(rr());
      base=rolls.reduce((x,y)=>x+y,0);
      detail=n>1?rolls.join(' + '):'';
    }
    const label=n+'d'+sides+(m?(m>0?'+':'−')+Math.abs(m):'');
    const nat=(sides===20&&n===1)?(base===20?'20 natural':base===1?'1 natural':''):'';
    setLog(l=>[{id:uid(),label,total:base+m,detail,nat},...l].slice(0,6));
  };
  const last=log[0];
  const out=div({className:'result','aria-live':'polite'},
    last?b2(last.total):span({className:'hint'},'Escolha um dado para rolar.'),
    last?span({className:'hint'},last.label+(last.detail?' · '+last.detail:'')+(last.nat?' · '+last.nat:'')):null);
  if(compact){
    return div({className:'dice-card'},
      div({className:'dice-main'},div({className:'dice-face'+(rolling?' rolling':last?' landed':''),key:rolling?'rolling':last?last.id:'initial'},h(D20Icon,{size:150}),span({'aria-hidden':rolling},rolling?String(preview):last?String(last.total):'20')),
      div({'aria-live':'polite',className:'hint'},rolling?'Rolando…':last?(last.nat||'Resultado do d20'):'Role um d20 agora'),
      btn({type:'button',className:'btn primary',disabled:rolling,onClick:animateRoll},'Rolar d20')),
      div({className:'dice-history'},b2('Histórico'),span({className:'hint'},'↓ Mais recentes no topo'),
      log.length>1?div({className:'log'},log.slice(1).map(x=>div({key:x.id,className:'roll-entry'},span(null,x.label),b2(x.total)))):span({className:'hint'},'As rolagens anteriores aparecem aqui.')));
  }
  return div({className:'roller'},
    div({className:'rollopts'},
      lab({className:'field'},span({className:'lbl'},'Quantidade'),inp({type:'number',min:1,max:20,value:qty,onChange:e=>setQty(e.target.value)})),
      lab({className:'field'},span({className:'lbl'},'Modificador'),inp({type:'number',value:mod,onChange:e=>setMod(e.target.value)})),
      lab({className:'field wide'},span({className:'lbl'},'Em 1d20'),sel({value:adv,onChange:e=>setAdv(e.target.value)},opt({value:'normal'},'Normal'),opt({value:'vantagem'},'Vantagem'),opt({value:'desvantagem'},'Desvantagem')))),
    div({className:'dice-row'},DICE.map(s=>btn({key:s,type:'button',className:'btn',onClick:()=>roll(s)},'d'+s))),
    out,
    log.length>1?div({className:'log'},log.slice(1).map(x=>span({key:x.id},x.label+' = '+x.total+(x.detail?'  ('+x.detail+')':'')))):null);
}

/* ---------- fichas ---------- */
function FichasPage({sheets,onCreate,onDup,onDel,onImport}){
  return div(null,
    h(PageHead,{eyebrow:'Fichas',title:'Crie e guarde suas fichas',lead:'Escolha um modelo pronto, ajuste os campos do seu jeito ou monte uma ficha do zero. Tudo fica salvo neste navegador.'}),
    sect(null,h2(null,'Modelos'),
      para({className:'hint',style:{margin:'.3rem 0 0'}},'Depois de criar, o modo Montar permite renomear, remover e adicionar campos em qualquer modelo.'),
      div({className:'tpl-grid'},TEMPLATES.map(t=>h(TplCard,{key:t.key,t,onCreate})))),
    sect({className:'saved'},h2(null,'Suas fichas'),
      sheets.length===0
        ?div({className:'empty'},'Nenhuma ficha ainda. Escolha um modelo acima e a primeira ficha aparece aqui.')
        :div({style:{marginTop:'10px'}},sheets.map(s=>div({key:s.id,className:'row'},
            div({className:'grow'},div(null,span({style:{fontWeight:600}},s.name||'Sem nome')),sm({className:'hint'},(s.system||'Ficha')+' · editada em '+new Date(s.updated||Date.now()).toLocaleDateString('pt-BR'))),
            lnk({className:'btn small primary',href:'#ficha-'+s.id},'Abrir'),
            btn({type:'button',className:'btn small',onClick:()=>onDup(s.id)},'Duplicar'),
            h(Confirm,{label:'Excluir',onYes:()=>onDel(s.id)}))))),
    h(Backup,{sheets,onImport}));
}

const Footer=()=>h('footer',{className:'foot-site'},'Forja de Fichas. Projeto de exemplo para mesas de RPG. As campanhas e os dados de mestre e jogadores exibidos aqui são fictícios.');

/* ---------- app ---------- */
function App(){
  const route=useRoute();
  const [created,setCreated]=useLS('forja-created-campaigns-v1',[]);
  const readLocal=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback;}catch(e){return fallback;}};
  const allCampaigns=[...created,...CAMPAIGNS].map(c=>({...c,...readLocal('forja-settings-'+c.id,{}),cast:readLocal('forja-players-'+c.id,c.cast),sessions:readLocal('forja-sessions-'+c.id,c.sessions)}));
  const ownCampaigns=allCampaigns.map(c=>({...c,myRole:c.owned||GM_CAMPS.some(g=>g.id===c.id)?'master':MY_CAMPS.some(([id])=>id===c.id)?'player':null})).filter(c=>c.myRole);
  const masterCampaigns=ownCampaigns.filter(c=>c.myRole==='master');
  const playerCampaigns=ownCampaigns.filter(c=>c.myRole==='player');
  const [store,setStore]=useState(loadStore);
  const [openMode,setOpenMode]=useState('fill');
  const [saveState,setSaveState]=useState('ok');
  useEffect(()=>{
    const t=setTimeout(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(store));setSaveState('ok');}catch(e){setSaveState('fail');}},300);
    return ()=>clearTimeout(t);
  },[store]);
  const update=(id,fn)=>setStore(s=>({...s,sheets:s.sheets.map(x=>x.id===id?fn(x):x)}));
  const create=(t)=>{
    const sections=t.build();
    const sheet={id:uid(),name:t.defaultName,tpl:t.key,system:t.system,sections,data:initData(sections),updated:Date.now()};
    setStore(s=>({...s,sheets:[sheet,...s.sheets]}));
    setOpenMode(t.key==='blank'?'build':'fill');
    go('ficha-'+sheet.id);
  };
  const dup=(id)=>setStore(s=>{
    const src=s.sheets.find(x=>x.id===id);if(!src)return s;
    const copy=JSON.parse(JSON.stringify(src));copy.id=uid();copy.name=(src.name||'Ficha')+' (cópia)';copy.updated=Date.now();
    return {...s,sheets:[copy,...s.sheets]};
  });
  const del=(id)=>setStore(s=>({...s,sheets:s.sheets.filter(x=>x.id!==id)}));
  const imp=(list)=>setStore(s=>({...s,sheets:[...list,...s.sheets]}));
  const fichas=()=>h(FichasPage,{sheets:store.sheets,onCreate:create,onDup:dup,onDel:del,onImport:imp});
  let page;
  if(route.startsWith('ficha-')){
    const sheet=store.sheets.find(x=>x.id===route.slice(6));
    page=sheet?h(SheetView,{key:sheet.id,sheet,update,onBack:()=>go('fichas'),initialMode:openMode,saveState}):fichas();
  }else if(route.startsWith('campanha-')){page=h(CampaignDetail,{id:route.slice(9),campaigns:ownCampaigns});}
  else if(route==='campanhas')page=h(CampaignsPage,{campaigns:ownCampaigns,onCreate:c=>setCreated(old=>[c,...old])});
  else if(route.startsWith('mestre-')){const c=masterCampaigns.find(x=>x.id===route.slice(7));page=c?h(MasterDashboard,{key:c.id,campaign:c}):h(MestrePage,{campaigns:masterCampaigns});}
  else if(route==='mestre')page=h(MestrePage,{campaigns:masterCampaigns});
  else if(route.startsWith('jogador-')){const c=playerCampaigns.find(x=>x.id===route.slice(8));page=c?h(PlayerDashboard,{key:c.id,campaign:c}):h(MestrePage,{player:true,campaigns:playerCampaigns});}
  else if(route==='jogadores')page=h(MestrePage,{player:true,campaigns:playerCampaigns});
  else if(route==='fichas')page=fichas();
  else page=h(Landing,{campaigns:ownCampaigns});
  return div({className:'site-shell'},
    (route.startsWith('mestre-')||route.startsWith('jogador-'))?null:h(Nav,{route}),
    saveState==='fail'?div({className:'warn',role:'alert'},'Este navegador não deixou salvar. Use o Backup das fichas, na página Fichas, para guardar uma cópia.'):null,
    div({className:'site-main'},page),
    h(Footer));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
